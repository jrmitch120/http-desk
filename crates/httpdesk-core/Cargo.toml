[package]
name = "httpdesk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
brotli-decompressor = "6.2.0"
chrono = "0.4.45"
cookie = "0.18.2"
cookie_store = { version = "0.22.1", default-features = false, features = ["preserve_order"] }
encoding_rs = "0.8.44"
flate2 = "1.1.10"
futures-util = "0.3.34"
http = "1.5.0"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy"] }
ignore = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "charset", "http2", "cookies"] }
rquickjs = "0.14"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_json_path = "0.7.2"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "fs", "macros", "sync", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower-layer = "0.3.3"
tower-service = "0.3.3"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
zstd = "0.14.3"

[dev-dependencies]
brotli = "9.1.1"
insta = "1.49.0"
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
