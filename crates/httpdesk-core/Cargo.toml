[package]
name = "httpdesk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
encoding_rs = "0.8.44"
futures-util = "0.3.34"
ignore = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "charset", "http2", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_json_path = "0.7.2"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "fs", "macros", "sync"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
