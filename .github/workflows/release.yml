name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0 (must match the app version)
        required: true
        type: string

permissions:
  contents: read

env:
  # The tag being released: the pushed tag, or the one given to a manual run.
  # Both jobs check out this tag, so a manual run builds exactly what was tagged.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Pre-flight (version and tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Tag matches the app version
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: cargo test --workspace

  bundle:
    needs: preflight
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # The web build runs npm dependency code, so it gets its own step with no
      # signing secrets in its environment. The bundling step below reuses dist/.
      - name: Build frontend
        run: pnpm build
      # Produces .dmg/.app (macOS), .msi/.exe (Windows), .deb/.rpm/.AppImage (Linux)
      # and attaches them to a draft GitHub release, together with signed updater
      # bundles and the latest.json manifest the in-app updater reads. Updater
      # artifacts are enabled only here (tauri.updater.conf.json) so local builds
      # don't need the signing key. tauri.prebuilt-frontend.conf.json empties
      # beforeBuildCommand so the Tauri CLI doesn't re-run `pnpm build` while the
      # signing key is in scope.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: HttpDesk ${{ env.RELEASE_TAG }}
          releaseDraft: true
          includeUpdaterJson: true
          args: >-
            ${{ matrix.args }}
            --config src-tauri/tauri.updater.conf.json
            --config src-tauri/tauri.prebuilt-frontend.conf.json
